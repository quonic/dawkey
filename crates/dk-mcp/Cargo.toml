[package]
name = "dk-mcp"
description = "Dawkey's MCP server: tools for Claude and for the test harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dk-app.workspace = true
dk-core.workspace = true
dk-ui.workspace = true
dk-media.workspace = true
dk-studio.workspace = true
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["server", "http1", "tokio", "service"] }
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-std", "io-util", "macros", "signal", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
