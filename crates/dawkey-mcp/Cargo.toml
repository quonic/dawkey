[package]
name = "dawkey-mcp"
version = "0.1.4"
edition.workspace = true
rust-version.workspace = true
description = "Dawkey's MCP server: tools for Claude and for the test harness"
repository.workspace = true
license.workspace = true

[lib]
name = "dawkey_mcp"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
dawkey-app.workspace = true
dawkey-core.workspace = true
dawkey-media.workspace = true
dawkey-studio.workspace = true
dawkey-ui.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["http1", "server", "service", "tokio"] }
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt", "signal", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
